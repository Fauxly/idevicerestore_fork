name: build

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  build-linux-ubuntu:
    runs-on: ubuntu-latest
    steps:
    - name: install dependencies
      run: |
          sudo apt-get update
          sudo apt-get install libzip-dev libcurl4-openssl-dev libusb-1.0-0-dev

    - name: prepare environment
      run: |
          echo "target_triplet=`gcc -dumpmachine`" >> $GITHUB_ENV

    - name: fetch libirecovery
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libirecovery-latest_${{env.target_triplet}}
        repo: libimobiledevice/libirecovery

    - name: fetch libplist
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libplist-latest_${{env.target_triplet}}
        repo: libimobiledevice/libplist

    - name: fetch libusbmuxd
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libusbmuxd-latest_${{env.target_triplet}}
        repo: libimobiledevice/libusbmuxd

    - name: fetch libimobiledevice-glue
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libimobiledevice-glue-latest_${{env.target_triplet}}
        repo: libimobiledevice/libimobiledevice-glue

    - name: fetch libimobiledevice
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libimobiledevice-latest_${{env.target_triplet}}
        repo: libimobiledevice/libimobiledevice

    - name: fetch libtatsu
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libtatsu-latest_${{env.target_triplet}}
        repo: libimobiledevice/libtatsu

    - name: install external dependencies
      run: |
          mkdir extract
          for I in *.tar; do
            tar -C extract -xvf $I
          done
          rm -rf extract/lib
          sudo cp -r extract/* /
          sudo ldconfig

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: autogen
      run: ./autogen.sh PKG_CONFIG_PATH=/usr/local/lib/pkgconfig

    - name: make
      run: make

    - name: make install
      run: sudo make install

    - name: prepare artifact
      run: |
          mkdir -p dest
          DESTDIR=`pwd`/dest make install
          tar -C dest -cf idevicerestore.tar usr

    - name: publish artifact
      uses: actions/upload-artifact@v4
      with:
        name: idevicerestore-latest_${{env.target_triplet}}
        path: idevicerestore.tar


  build-macOS:
    runs-on: macOS-latest

    steps:
    - name: install dependencies
      run: |
          if test -x "`which port`"; then
            sudo port install libtool autoconf automake pkgconfig zstd
          else
            brew install libtool autoconf automake pkgconfig zstd
          fi
      shell: bash

    - name: fetch libplist
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libplist-latest_macOS
        repo: libimobiledevice/libplist

    - name: fetch libusbmuxd
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libusbmuxd-latest_macOS
        repo: libimobiledevice/libusbmuxd

    - name: fetch libimobiledevice-glue
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libimobiledevice-glue-latest_macOS
        repo: libimobiledevice/libimobiledevice-glue

    - name: fetch libimobiledevice
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libimobiledevice-latest_macOS
        repo: libimobiledevice/libimobiledevice

    - name: fetch libtatsu
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libtatsu-latest_macOS
        repo: libimobiledevice/libtatsu

    - name: install external dependencies
      run: |
          mkdir extract
          for I in *.tar; do
            tar -C extract -xvf "$I"
          done
          sudo cp -r extract/* /

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: build and install Turdus libirecovery
      run: |
          echo "=== Building Turdus Merula libirecovery ==="

          git clone https://github.com/turdus-m3rula/libirecovery.git /tmp/turdus-libirecovery
          cd /tmp/turdus-libirecovery

          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CFLAGS="${{env.BUILD_CFLAGS}}"
          export CXXFLAGS="${{env.BUILD_CFLAGS}}"
          export LDFLAGS="-arch arm64 -arch x86_64 -isysroot ${{env.SDKDIR}}"

          echo "CFLAGS=$CFLAGS"
          echo "CXXFLAGS=$CXXFLAGS"
          echo "LDFLAGS=$LDFLAGS"

          ./autogen.sh --prefix=/usr/local
          make -j"$(sysctl -n hw.ncpu)"
          sudo make install

          echo "=== Checking installed Turdus libirecovery ==="
          pkg-config --modversion libirecovery-1.0
          grep -n -E 'IRECV_K_PONGO_MODE|irecv_pongo_send_buffer|irecv_usb_control_transfer_no_timeout_retval' /usr/local/include/libirecovery.h

          echo "=== Checking libirecovery architectures ==="
          LIBIRECOVERY_LIB="$(find /usr/local/lib -maxdepth 1 \( -name 'libirecovery-1.0.a' -o -name 'libirecovery-1.0.dylib' \) | head -n 1)"
          if [ -z "$LIBIRECOVERY_LIB" ]; then
            echo "ERROR: libirecovery library not found in /usr/local/lib"
            exit 1
          fi
          echo "Checking: $LIBIRECOVERY_LIB"
          lipo -info "$LIBIRECOVERY_LIB"
          lipo -verify_arch arm64 x86_64 "$LIBIRECOVERY_LIB"

          echo "SUCCESS: Turdus libirecovery installed"

    - name: build and install libgeneral
      run: |
          echo "=== Building libgeneral ==="

          git clone https://github.com/tihmstar/libgeneral.git /tmp/libgeneral
          cd /tmp/libgeneral

          echo "libgeneral git commit count:"
          git rev-list --count HEAD

          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          ./autogen.sh --prefix=/usr/local
          make -j"$(sysctl -n hw.ncpu)"
          sudo make install

          echo "=== Checking libgeneral ==="
          pkg-config --modversion libgeneral
          pkg-config --cflags libgeneral
          pkg-config --libs libgeneral


    - name: build and install libfragmentzip
      run: |
          echo "=== Building libfragmentzip ==="

          git clone https://github.com/tihmstar/libfragmentzip.git /tmp/libfragmentzip
          cd /tmp/libfragmentzip

          echo "libfragmentzip git commit count:"
          git rev-list --count HEAD

          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          ./autogen.sh --prefix=/usr/local
          make -j"$(sysctl -n hw.ncpu)"
          sudo make install

          echo "=== Checking libfragmentzip ==="
          pkg-config --modversion libfragmentzip
          pkg-config --cflags libfragmentzip
          pkg-config --libs libfragmentzip

          echo "SUCCESS: libfragmentzip installed"

    - name: install additional requirements
      run: |
          SDKDIR=`xcrun --sdk macosx --show-sdk-path 2>/dev/null`
          echo "SDKDIR=$SDKDIR" >> $GITHUB_ENV

          TESTARCHS="arm64 x86_64"
          USEARCHS=

          for ARCH in $TESTARCHS; do
            if echo "int main(int argc, char **argv) { return 0; }" | \
              clang -arch $ARCH \
              -o /dev/null \
              -isysroot $SDKDIR \
              -x c - 2>/dev/null; then

              USEARCHS="$USEARCHS -arch $ARCH"

            fi
          done

          export CFLAGS="$USEARCHS -isysroot $SDKDIR"

          echo "Using CFLAGS: $CFLAGS"

          echo "BUILD_CFLAGS=$CFLAGS" >> $GITHUB_ENV

          mkdir -p deps

          FILENAME="libzip-static.tar.bz2"

          curl -o $FILENAME.b64 -Ls \
            "https://gist.github.com/nikias/3da15d03120382f87b44029cd8495a02/raw/99cd8138fed99e8f6530b6f179f787342c698e1f/libzip-1.7.1_static_macOS.tar.bz2"

          base64 -D < $FILENAME.b64 > $FILENAME

          tar -C deps -xjf $FILENAME

          echo "LIBZIP_CFLAGS=-I`pwd`/deps/include" >> $GITHUB_ENV

          echo "LIBZIP_LIBS=`pwd`/deps/lib/libzip.a -Xlinker ${SDKDIR}/usr/lib/libbz2.tbd -Xlinker ${SDKDIR}/usr/lib/liblzma.tbd -lz" >> $GITHUB_ENV

    - name: verify libfragmentzip
      run: |
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig:${PKG_CONFIG_PATH:-}"

          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"

          if ! pkg-config --exists libfragmentzip; then
              echo "ERROR: libfragmentzip is not available through pkg-config"
              exit 1
          fi

          echo "libfragmentzip version:"
          pkg-config --modversion libfragmentzip

          echo "libfragmentzip CFLAGS:"
          pkg-config --cflags libfragmentzip

          echo "libfragmentzip LIBS:"
          pkg-config --libs libfragmentzip

          echo "SUCCESS: libfragmentzip found"

    - name: autogen with Turdus Merula
      run: |
          export CFLAGS="${{env.BUILD_CFLAGS}} -Wno-nullability-completeness -Wno-expansion-to-defined"

          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig:${PKG_CONFIG_PATH:-}"

          echo "Using CFLAGS: $CFLAGS"
          echo "Using PKG_CONFIG_PATH: $PKG_CONFIG_PATH"

          echo "=== Checking libfragmentzip ==="

          pkg-config --modversion libfragmentzip

          ./autogen.sh --with-turdusmerula \
              libcurl_CFLAGS="-I${{env.SDKDIR}}/usr/include" \
              libcurl_LIBS="-lcurl" \
              libzip_CFLAGS="$LIBZIP_CFLAGS" \
              libzip_LIBS="$LIBZIP_LIBS" \
              zlib_CFLAGS="-I${{env.SDKDIR}}/usr/include" \
              zlib_LIBS="-lz" \
              libimobiledevice_CFLAGS="-I/usr/local/include" \
              libimobiledevice_LIBS="-L/usr/local/lib -lusbmuxd-2.0 -limobiledevice-glue-1.0 -limobiledevice-1.0"

          echo "========================================"
          echo "Checking HAVE_TURDUS_MERULA"
          echo "========================================"

          grep -n "HAVE_TURDUS_MERULA" config.h || true

          if ! grep -q '^#define HAVE_TURDUS_MERULA 1' config.h; then
              echo "ERROR: HAVE_TURDUS_MERULA is not enabled"
              exit 1
          fi

          echo "SUCCESS: HAVE_TURDUS_MERULA is enabled"

    - name: make
      run: make

    - name: verify Turdus Merula build
      run: |
          echo "========================================"
          echo "Checking final idevicerestore binary"
          echo "========================================"

          file ./src/idevicerestore

          echo "Searching for Turdus Merula options..."

          strings ./src/idevicerestore | grep -E \
            'show-hash|override-cpf|override-ramdisk|api-url|rsep-manifest|rsep-variant' || true

          if ! strings ./src/idevicerestore | grep -q "override-cpf"; then
              echo "ERROR: Turdus Merula options are missing from binary"
              exit 1
          fi

          echo "SUCCESS: Turdus Merula support is present in binary"

    - name: show Turdus Merula help
      run: |
          ./src/idevicerestore --help || true

    - name: make install
      run: sudo make install

    - name: prepare artifact
      run: |
          mkdir -p dest
          DESTDIR=`pwd`/dest make install
          tar -C dest -cf idevicerestore.tar usr

    - name: publish artifact
      uses: actions/upload-artifact@v4
      with:
        name: idevicerestore-latest_macOS
        path: idevicerestore.tar


  build-windows:
    runs-on: windows-2019
    defaults:
      run:
        shell: msys2 {0}

    strategy:
      fail-fast: false
      matrix:
        include: [
          { msystem: MINGW64, arch: x86_64 },
          { msystem: MINGW32, arch: i686   }
        ]

    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        release: false
        update: false
        install: >-
          base-devel
          git
          mingw-w64-${{ matrix.arch }}-gcc
          make
          libtool
          autoconf
          automake-wrapper
          liblzma

    - name: prepare environment
      run: |
          dest=`echo ${{ matrix.msystem }} |tr [:upper:] [:lower:]`
          echo "dest=$dest" >> $GITHUB_ENV
          echo "target_triplet=`gcc -dumpmachine`" >> $GITHUB_ENV

    - name: fetch libirecovery
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libirecovery-latest_${{ matrix.arch }}-${{ env.dest }}
        repo: libimobiledevice/libirecovery

    - name: fetch libplist
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libplist-latest_${{ matrix.arch }}-${{ env.dest }}
        repo: libimobiledevice/libplist

    - name: fetch libusbmuxd
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libusbmuxd-latest_${{ matrix.arch }}-${{ env.dest }}
        repo: libimobiledevice/libusbmuxd

    - name: fetch libimobiledevice-glue
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libimobiledevice-glue-latest_${{ matrix.arch }}-${{ env.dest }}
        repo: libimobiledevice/libimobiledevice-glue

    - name: fetch libimobiledevice
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libimobiledevice-latest_${{ matrix.arch }}-${{ env.dest }}
        repo: libimobiledevice/libimobiledevice

    - name: fetch libtatsu
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: build.yml
        name: libtatsu-latest_${{ matrix.arch }}-${{ env.dest }}
        repo: libimobiledevice/libtatsu

    - name: install external dependencies
      run: |
          mkdir extract
          for I in *.tar; do
            tar -C extract -xvf $I
          done
          cp -r extract/* /

    - uses: actions/checkout@v4

    - name: install additional requirements
      run: |
          FILENAME="libzip-1.7.1-static.tar.bz2"

          curl -o $FILENAME.b64 -Ls \
            "https://gist.github.com/nikias/3da15d03120382f87b44029cd8495a02/raw/99cd8138fed99e8f6530b6f179f787342c698e1f/libzip-1.7.1_static_${{matrix.arch}}-${{env.dest}}.tar.bz2"

          base64 -d < $FILENAME.b64 > $FILENAME

          mkdir deps

          tar -C deps -xjf $FILENAME

          echo "LIBZIP_CFLAGS=-I`pwd`/deps/include" >> $GITHUB_ENV

          echo "LIBZIP_LIBS=`pwd`/deps/lib/libzip.a /${{env.dest}}/lib/libbz2.a /${{env.dest}}/lib/liblzma.a " >> $GITHUB_ENV


          FILENAME="libcurl-8.1.0-static.tar.bz2"

          curl -o $FILENAME.b64 -Ls \
            "https://gist.github.com/nikias/6c397a0a2f4f4eafd91b81cccd22b761/raw/85216e60af6787f3b351291165eb91bd585ff09a/libcurl-8.1.0-static-${{matrix.arch}}-${{env.dest}}.tar.bz2"

          base64 -d < $FILENAME.b64 > $FILENAME

          tar -C deps -xjf $FILENAME

          echo "LIBCURL_CFLAGS=-I`pwd`/deps/include -DCURL_STATICLIB" >> $GITHUB_ENV

          echo "LIBCURL_LIBS=`pwd`/deps/lib/libcurl.a /${{env.dest}}/lib/libzstd.a -lws2_32 -lcrypt32 -lwldap32 -lbcrypt -lssl -lcrypto" >> $GITHUB_ENV

    - name: autogen
      run: |
          ./autogen.sh CC=gcc CXX=g++ \
              libzip_VERSION=1.7.1 \
              libzip_CFLAGS="${{env.LIBZIP_CFLAGS}}" \
              libzip_LIBS="${{env.LIBZIP_LIBS}}" \
              zlib_LIBS="/${{env.dest}}/lib/libz.a" \
              libcurl_CFLAGS="${{env.LIBCURL_CFLAGS}}" \
              libcurl_LIBS="$LIBCURL_LIBS"

    - name: make
      run: make

    - name: make install
      run: make install

    - name: prepare artifact
      run: |
          mkdir -p dest
          DESTDIR=`pwd`/dest make install
          tar -C dest -cf idevicerestore.tar ${{ env.dest }}

    - name: publish artifact
      uses: actions/upload-artifact@v4
      with:
        name: idevicerestore-latest_${{ matrix.arch }}-${{ env.dest }}
        path: idevicerestore.tar


  build-docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: build
        run: |
          pushd docker
          ./build.sh
          popd

          docker image save \
            -o idevicerestore-docker.tar \
            idevicerestore-docker

      - name: publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: idevicerestore-latest_docker
          path: idevicerestore-docker.tar
