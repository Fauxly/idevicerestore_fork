name: Build idevicerestore macOS

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew update
          brew install \
            autoconf \
            automake \
            libtool \
            pkg-config \
            xz \
            libzip \
            libusb \
            openssl@3 \
            zstd \
            libplist \
            libimobiledevice-glue \
            libusbmuxd \
            libimobiledevice

      - name: Set build environment
        run: |
          SDKDIR="$(xcrun --sdk macosx --show-sdk-path)"

          echo "SDKDIR=$SDKDIR" >> "$GITHUB_ENV"

          echo "BUILD_CFLAGS=-arch arm64 -arch x86_64 -isysroot $SDKDIR" >> "$GITHUB_ENV"

          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/opt/homebrew/lib/pkgconfig" >> "$GITHUB_ENV"

          echo "LIBZIP_CFLAGS=-I$(brew --prefix libzip)/include" >> "$GITHUB_ENV"

          echo "LIBZIP_LIBS=-L$(brew --prefix libzip)/lib -lzip -lbz2 -llzma -lz" >> "$GITHUB_ENV"

      - name: Verify Turdus source files
        run: |
          echo "Contents of src/stuff:"
          ls -lah src/stuff || true

          echo ""
          echo "Checking required binary modules..."

          REQUIRED_FILES=(
            "Pongo.bin"
            "sep_racer.bin"
            "kpf.bin"
            "cpf.bin"
            "overlay_iphoneos.bin"
            "union_iphoneos.bin"
            "overlay_tvos.bin"
            "union_tvos.bin"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "src/stuff/$FILE" ]; then
              echo "ERROR: Missing src/stuff/$FILE"
              exit 1
            else
              echo "FOUND: src/stuff/$FILE"
            fi
          done

      - name: Generate embedded Turdus modules
        run: |
          cd src/stuff

          echo "Generating embedded C sources..."

          xxd -i Pongo.bin > Pongo_bin.c
          xxd -i sep_racer.bin > sep_racer_bin.c
          xxd -i kpf.bin > kpf_bin.c
          xxd -i cpf.bin > cpf_bin.c

          xxd -i overlay_iphoneos.bin > overlay_iphoneos_bin.c
          xxd -i union_iphoneos.bin > union_iphoneos_bin.c

          xxd -i overlay_tvos.bin > overlay_tvos_bin.c
          xxd -i union_tvos.bin > union_tvos_bin.c

          echo ""
          echo "Generated files:"
          ls -lh *_bin.c

      - name: Verify generated C sources
        run: |
          REQUIRED_FILES=(
            "cpf_bin.c"
            "kpf_bin.c"
            "Pongo_bin.c"
            "sep_racer_bin.c"
            "overlay_iphoneos_bin.c"
            "overlay_tvos_bin.c"
            "union_iphoneos_bin.c"
            "union_tvos_bin.c"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "src/stuff/$FILE" ]; then
              echo "ERROR: Failed to generate src/stuff/$FILE"
              exit 1
            else
              echo "GENERATED: src/stuff/$FILE"
            fi
          done

      - name: Autogen and configure
        run: |
          export CFLAGS="${BUILD_CFLAGS} -Wno-nullability-completeness -Wno-expansion-to-defined"

          export PKG_CONFIG_PATH="${PKG_CONFIG_PATH}"

          echo "Using SDKDIR: ${SDKDIR}"
          echo "Using CFLAGS: ${CFLAGS}"
          echo "Using PKG_CONFIG_PATH: ${PKG_CONFIG_PATH}"

          ./autogen.sh \
            --with-turdusmerula \
            libcurl_CFLAGS="-I${SDKDIR}/usr/include" \
            libcurl_LIBS="-lcurl" \
            libzip_CFLAGS="${LIBZIP_CFLAGS}" \
            libzip_LIBS="${LIBZIP_LIBS}" \
            zlib_CFLAGS="-I${SDKDIR}/usr/include" \
            zlib_LIBS="-lz"

      - name: Build
        run: |
          make -j"$(sysctl -n hw.ncpu)"

      - name: Install
        run: |
          sudo make install

      - name: Verify binary
        run: |
          echo "Checking installed idevicerestore..."

          which idevicerestore || true

          if command -v idevicerestore >/dev/null 2>&1; then
            idevicerestore --help || true
          fi

      - name: Prepare artifact
        run: |
          rm -rf dest
          mkdir -p dest

          DESTDIR="$(pwd)/dest" make install

          echo "Installed files:"
          find dest -type f -print

          tar -C dest -czf idevicerestore-macos.tar.gz usr

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: idevicerestore-macos
          path: idevicerestore-macos.tar.gz
          if-no-files-found: error
